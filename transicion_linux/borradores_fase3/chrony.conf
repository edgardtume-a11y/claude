# chrony.conf — BORRADOR FASE 3, NO ACTIVADO
# Proyecto JEAN_FLOW 555 META_QUANT — disciplina de reloj en Linux.
#
# Sustituye al perfil PublicInternet de Configure-W32Time.ps1 (sondeo cada
# 2048 s). chronyd sondea de forma adaptativa (minpoll/maxpoll) y corrige
# DESLIZANDO el reloj; el protocolo del proyecto prohíbe cualquier escalón
# durante una captura (README_NTP_WINDOWS.md:18) y aquí eso se garantiza
# por configuración: makestep solo actúa en las 3 primeras actualizaciones
# tras el arranque del servicio.

# Cuatro fuentes independientes del pool público, como el perfil actual.
# iburst acelera la primera sincronización sin violar la etiqueta del pool.
pool pool.ntp.org iburst maxsources 4

# Fichero de deriva persistente: chronyd aprende la tasa de deriva del
# oscilador entre arranques. Esto es lo que un cliente de una sola
# observación no puede dar (INFORME_TRANSICION_LINUX_v2, sección 5).
driftfile /var/lib/chrony/drift

# Escalonar SOLO al arrancar el servicio (3 primeras actualizaciones) y solo
# si el desvío supera 1 s. Después de eso, chronyd desliza siempre: durante
# una captura el reloj de pared jamás salta por disciplina.
makestep 1.0 3

# Sincronizar el reloj de hardware para que el próximo arranque parta cerca.
rtcsync

# Evidencia auditable y legible por máquina: el lector del proyecto usa
# `chronyc -c tracking` (CSV, independiente del idioma del sistema), y estos
# logs conservan la serie histórica de offset/frecuencia para un auditor.
logdir /var/log/chrony
log tracking measurements statistics

# Si ninguna fuente responde (red que bloquea NTP), chronyd NO inventa hora:
# queda en estado no sincronizado y el lector del proyecto FALLA CERRADO
# (error_code STATUS_UNSYNCHRONISED). No hay fallback silencioso.
